name: OmniPost CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.18.0

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile --dangerously-allow-all-builds

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Unit Tests
        run: pnpm run test

      - name: Build Monorepo
        run: pnpm run build
