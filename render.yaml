services:
  # NestJS API Backend Service
  - type: web
    name: omnipost-api
    env: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: omnipost-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: omnipost-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ADMIN_SECRET
        generateValue: true

  # Redis Cache for BullMQ Queues
  - type: redis
    name: omnipost-redis
    plan: free
    ipAllowList: []

databases:
  # PostgreSQL Database for Prisma ORM
  - name: omnipost-postgres
    plan: free
    databaseName: omnipost
    user: omnipost
